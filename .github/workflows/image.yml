# Publishes the build image to GHCR. It holds the tools only, never anything
# from the game. Run it by pushing a tag image-vN; then write the digest it
# prints into host/builder/isb/image.json and make a program release.
# The first time, make the package public: Packages -> isaac-switch-builder ->
# Package settings -> Change visibility.
name: image
on:
  push:
    tags: ["image-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      # The image is about 7.4 GB; the runner starts with little more free than that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Tools for building the Isaac Switch native port from your own copy of the game. Contains nothing from the game.
            org.opencontainers.image.licenses=GPL-3.0-or-later
          tags: |
            ghcr.io/${{ github.repository_owner }}/isaac-switch-builder:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/isaac-switch-builder:latest
      - run: |
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "Image digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
